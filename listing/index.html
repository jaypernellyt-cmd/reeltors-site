<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Home for sale</title><link rel="stylesheet" href="../style.css" /><link rel="stylesheet" href="../bio.css" /></head>
<body><main id="app"><div class="wrap"><p class="muted" style="padding-top:40px">Loading…</p></div></main>
<script src="../common.js"></script>
<script>
function agentBlock(a) {
  if (!a) return '';
  const book = safe(a.booking_url);
  const phone = a.phone ? a.phone.replace(/[^0-9+]/g, '') : '';
  return '<div class="card"><div class="agent">' + (a.headshot_url ? '<img src="' + esc(a.headshot_url) + '" alt="">' : '<div class="ph"></div>') +
    '<div><h2 style="margin:0">' + esc(a.display_name || 'Your agent') + '</h2><div class="muted">' + esc([a.title, a.company_name].filter(Boolean).join(' · ')) + '</div></div></div>' +
    (book ? '<a class="btn primary" href="' + esc(book) + '">Schedule a call</a>' : phone ? '<a class="btn primary" href="tel:' + esc(phone) + '">Call ' + esc(a.phone) + '</a>' : '') +
    (phone ? '<a class="btn ghost" href="sms:' + esc(phone) + '">Text me</a>' : '') +
    (a.email ? '<a class="btn ghost" href="mailto:' + esc(a.email) + '">Email me</a>' : '') +
    (a.license_number ? '<p class="small">License ' + esc(a.license_number) + (a.broker_name ? ' · Broker: ' + esc(a.broker_name) : '') + '</p>' : '') +
    '<p class="small">' + (safe(a.iabs_url) ? '<a href="' + esc(a.iabs_url) + '">Information About Brokerage Services</a>' : '') + (safe(a.consumer_protection_url) ? ' · <a href="' + esc(a.consumer_protection_url) + '">Consumer Protection Notice</a>' : '') + '</p>' +
    (a.disclosures ? '<p class="small">' + esc(a.disclosures) + '</p>' : '') + (a.equal_housing ? '<p class="small">Equal Housing Opportunity</p>' : '') + '</div>';
}
const slug = new URLSearchParams(location.search).get('l') || '';
const app = document.getElementById('app');
(async () => {
  const d = /^[a-z0-9]{6,32}$/.test(slug) ? await load({ listing: slug }) : null;
  if (!d) { app.innerHTML = '<div class="wrap"><h1 style="padding-top:40px">This listing isn’t available</h1><p class="muted">It may have sold or the agent unpublished it.</p></div>'; return; }
  const l = d.listing, a = d.agent || {}, oh = d.open_house;
  accent(a);
  const from = new URLSearchParams(location.search).get('from');
  const bio = /^[a-z0-9]{6,32}$/.test(from || '') ? from : a.bio_slug;
  const top = '<div class="lbar">' + (bio ? '<a class="back" href="../agent/?a=' + encodeURIComponent(bio) + '">‹ ' + esc(a.display_name || 'Back') + '</a>' : '<span></span>') + madeWith() + '</div>';
  document.title = l.address_line + (l.city ? ', ' + l.city : '');
  const stats = [l.beds && l.beds + ' beds', l.baths && l.baths + ' baths', l.sqft && Number(l.sqft).toLocaleString('en-US') + ' sq ft'].filter(Boolean);
  const hero = l.video_url
    ? '<video class="video" src="' + esc(l.video_url) + '"' + (l.poster_url ? ' poster="' + esc(l.poster_url) + '"' : '') + ' autoplay muted loop playsinline controls></video>'
    : l.photos[0] ? '<img class="hero" src="' + esc(l.photos[0]) + '" alt="">' : '';
  let ohBlock = '';
  if (oh) {
    const tz = oh.timezone || 'America/Chicago', s = new Date(oh.starts_at), e = new Date(oh.ends_at);
    const t = (x) => x.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: tz }).replace(':00', '');
    ohBlock = '<div class="card"><span class="pill" style="margin:0 0 8px">OPEN HOUSE</span><div class="when">' + esc(s.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', timeZone: tz })) + ' · ' + esc(t(s)) + '–' + esc(t(e)) + '</div><a class="btn primary" href="../event/?e=' + encodeURIComponent(oh.slug) + '">Join the open house</a></div>';
  }
  const addr = [l.address_line, [l.city, l.state].filter(Boolean).join(', '), l.zip].filter(Boolean).join(' ');
  app.innerHTML = top + hero + '<div class="wrap">' +
    '<span class="pill">' + esc((l.status || 'active').replace('_', ' ').toUpperCase()) + '</span>' +
    '<h1>' + esc(l.address_line) + '</h1><div class="muted">' + esc([l.city, l.state].filter(Boolean).join(', ')) + '</div>' +
    '<div class="price">' + esc(money(l.price)) + '</div>' +
    '<div class="stats">' + stats.map((s) => '<span class="stat">' + esc(s) + '</span>').join('') + '</div>' +
    '<p><a href="https://maps.apple.com/?q=' + encodeURIComponent(addr) + '">Get directions</a></p>' +
    ohBlock + agentBlock(a) +
    (l.description ? '<div class="card"><h2>About this home</h2><p style="white-space:pre-line">' + esc(l.description) + '</p></div>' : '') +
    (l.photos.length > 1 ? '<div class="grid">' + l.photos.slice(1).map((p) => '<img src="' + esc(p) + '" alt="" loading="lazy">').join('') + '</div>' : '') +
    leadForm({ listing: slug }, a, 'Want more details or a private showing?') +
    (bio ? '<p style="margin-top:24px"><a href="../agent/?a=' + encodeURIComponent(bio) + '">More homes from ' + esc(a.display_name || 'this agent') + ' →</a></p>' : '') +
    '<p class="small" style="margin-top:24px">Information deemed reliable but not guaranteed. · <a href="../privacy/">Privacy</a></p>' + madeWith('center') + '</div>';
})();
</script></body></html>
