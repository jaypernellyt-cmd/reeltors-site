<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>Homes for sale</title><link rel="stylesheet" href="../bio.css" /></head>
<body class="bio"><main id="app" class="page"><p style="padding:60px 20px;color:#6B7390;text-align:center">Loading…</p></main>
<script src="../common.js"></script>
<script>
const slug = new URLSearchParams(location.search).get('a') || '';
const app = document.getElementById('app');
const share = () => (navigator.share ? navigator.share({ title: document.title, url: location.href }).catch(() => {}) : navigator.clipboard && navigator.clipboard.writeText(location.href).then(() => alert('Link copied')));

function homeCard(l, i) {
  const meta = [l.beds && l.beds + ' bd', l.baths && l.baths + ' ba', l.sqft && Number(l.sqft).toLocaleString('en-US') + ' sq ft'].filter(Boolean).join(' · ');
  const tag = { active: 'FOR SALE', coming_soon: 'COMING SOON', pending: 'PENDING', sold: 'SOLD' }[l.status] || 'FOR SALE';
  return '<a class="home" href="../listing/?l=' + encodeURIComponent(l.slug) + '&from=' + encodeURIComponent(slug) + '">' +
    '<div class="ph">' + (l.cover_url ? '<img src="' + esc(l.cover_url) + '" alt=""' + (i > 1 ? ' loading="lazy"' : '') + '>' : '') + '<span class="tag">' + tag + '</span></div>' +
    '<div class="info"><div class="price">' + esc(money(l.price) || 'Price on request') + '</div><div class="addr">' + esc(l.address_line) + '</div><div class="meta">' + esc([l.city, meta].filter(Boolean).join(' · ')) + '</div></div></a>';
}

(async () => {
  const d = /^[a-z0-9]{6,32}$/.test(slug) ? await load({ agent: slug }) : null;
  if (!d) { app.innerHTML = '<div class="topbar">' + madeWith() + '</div><div class="bhero"><h1>This page isn’t available</h1><p class="sub">The link may be old or turned off.</p></div>'; return; }
  const a = d.agent || {};
  accent(a);
  document.title = (a.display_name || 'Homes') + (a.company_name ? ' · ' + a.company_name : '');
  const phone = a.phone ? a.phone.replace(/[^0-9+]/g, '') : '';
  const book = safe(a.booking_url);
  const actions = [
    book ? '<a class="primary" href="' + esc(book) + '" target="_blank" rel="noopener">Schedule a call</a>' : phone ? '<a class="primary" href="tel:' + esc(phone) + '">Call me</a>' : '',
    phone ? '<a class="ghost" href="sms:' + esc(phone) + '">Text me</a>' : '',
    phone && book ? '<a class="ghost" href="tel:' + esc(phone) + '">Call</a>' : a.email ? '<a class="ghost" href="mailto:' + esc(a.email) + '">Email me</a>' : '',
  ].filter(Boolean).join('');
  const listings = d.listings || [];
  app.innerHTML =
    '<div class="topbar">' + madeWith() + '<button class="iconbtn" aria-label="Share" onclick="share()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button></div>' +
    '<section class="bhero">' + (a.headshot_url ? '<img class="avatar" src="' + esc(a.headshot_url) + '" alt="">' : '') +
      '<h1>' + esc(a.display_name || 'Your agent') + '</h1>' +
      '<div class="sub">' + esc([a.title, a.company_name].filter(Boolean).join(' · ')) + '</div>' +
      (a.bio_text ? '<p class="about">' + esc(a.bio_text) + '</p>' : '') +
      socialButtons(a) + '</section>' +
    (actions ? '<div class="actions">' + actions + '</div>' : '') +
    '<section class="section"><div class="head"><h2>My listings</h2>' + (listings.length > 1 ? '<div class="arrows"><button aria-label="Previous" onclick="document.getElementById(\'rail\').scrollBy({left:-280,behavior:\'smooth\'})">‹</button><button aria-label="Next" onclick="document.getElementById(\'rail\').scrollBy({left:280,behavior:\'smooth\'})">›</button></div>' : '') + '</div>' +
      (listings.length ? '<div class="rail" id="rail">' + listings.map((l, i) => homeCard(l, i)).join('') + '</div>' : '<div class="empty">New listings are on the way. Sign up below and you’ll hear first.</div>') +
    '</section>' +
    leadForm({ agent: slug }, a, 'Get new listings before anyone else') +
    compliance(a) +
    madeWith('center') +
    '<p class="foot"><a href="../privacy/">Privacy</a></p>';
})();
</script></body></html>
